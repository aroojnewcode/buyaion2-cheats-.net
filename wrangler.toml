# Static Astro site — do not auto-add @astrojs/cloudflare (keeps output in dist/).
name = "buyaion2cheats-net"
compatibility_date = "2025-10-11"

# Cloudflare Pages (Git) reads build output from here when wrangler.toml is present.
pages_build_output_dir = "./dist"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[[routes]]
pattern = "buyaion2cheats.net"
custom_domain = true

[[routes]]
pattern = "www.buyaion2cheats.net"
custom_domain = true
